}

// ════════════════════════════════════════════════════════════════════
// MAIN APP
// ════════════════════════════════════════════════════════════════════

function App() {
  const [rawTasks, setRawTasks] = useState(() => SEED_TASKS.map(t => ({...t})));
  const [deps, setDeps] = useState(() => SEED_DEPENDENCIES.map(d => ({...d})));
  const [projectName, setProjectName] = useState('Новый проект');
  const [projectStart, setProjectStart] = useState(() => {
    const starts = SEED_TASKS.map(t => t.start_date).filter(Boolean).sort();
    return starts[0] || new Date().toISOString().slice(0,10);
  });
  const [theme, setTheme] = useState(() => (typeof localStorage !== 'undefined' && localStorage.getItem('gantt-theme')) || 'dark');
  useEffect(() => {
    document.body.classList.toggle('light-theme', theme === 'light');
    if (typeof localStorage !== 'undefined') localStorage.setItem('gantt-theme', theme);
  }, [theme]);
  const [selectedTask, setSelectedTask] = useState(null);
  const [executorFilter, setExecutorFilter] = useState(null);
  const [showDeps, setShowDeps] = useState(true);
  const [showCritical, setShowCritical] = useState(false);
  const [toast, setToast] = useState(null);
  // Прогресс проекта рассчитывается автоматически: доля выполненных задач.
  const [showConfetti, setShowConfetti] = useState(false);
  const confettiTimerRef = useRef(null);
  const fileRef = useRef(null);
  const [chatOpen, setChatOpen] = useState(true);

  const tasks = useMemo(() => {
    const scheduled = computeSchedule(rawTasks, deps, projectStart);
    // Sort by start_date ascending — лесенка сверху вниз
    return [...scheduled].sort((a, b) => {
      if (!a.start_date) return 1;
      if (!b.start_date) return -1;
      return a.start_date.localeCompare(b.start_date) || (a.id || '').localeCompare(b.id || '');
    });
  }, [rawTasks, deps, projectStart]);
  
  // Compute expected project end date — latest end_date among all tasks
  // Реальная дата старта проекта = дата самой ранней задачи
  const projectActualStart = useMemo(() => {
    const starts = tasks.map(t => t.start_date).filter(Boolean);
    if (starts.length === 0) return projectStart;
    return starts.reduce((earliest, cur) => cur < earliest ? cur : earliest, starts[0]);
  }, [tasks, projectStart]);

  const projectEnd = useMemo(() => {
    const ends = tasks.map(t => t.end_date).filter(Boolean);
    if (ends.length === 0) return projectStart;
    return ends.reduce((latest, cur) => cur > latest ? cur : latest, ends[0]);
  }, [tasks, projectStart]);
  
  const { criticalIds, criticalDepIds } = useMemo(() => computeCriticalPath(tasks, deps), [tasks, deps]);

  const filteredTasks = useMemo(() => {
    if (!executorFilter) return tasks;
    return tasks.filter(t => t.assignee === executorFilter);
  }, [tasks, executorFilter]);

  const displayedTasks = executorFilter ? filteredTasks : tasks;

  const showToast = (msg) => {
    setToast(msg);
    setTimeout(() => setToast(null), 3000);
  };

  const handlePlanUpdate = useCallback((newRaw, newDeps) => {
    if (newRaw) setRawTasks(newRaw);
    if (newDeps) setDeps(newDeps);
    if (newRaw || newDeps) showToast('✅ План обновлён');
  }, []);

  const handleSaveTask = useCallback((updated) => {
    setRawTasks(prev => prev.map(t => t.id === updated.id ? updated : t));
    setSelectedTask(null);
    showToast('✅ Задача сохранена');
  }, []);

  const handleCompleteTask = useCallback((id) => {
    setRawTasks(prev => prev.map(t => t.id === id ? {...t, completed: !t.completed} : t));
    setSelectedTask(null);
    showToast('✅ Статус задачи изменён');
  }, []);

  const handleDeleteTask = useCallback((id) => {
    setRawTasks(prev => prev.filter(t => t.id !== id));
    setDeps(prev => prev.filter(d => d.from_task_id !== id && d.to_task_id !== id));
    setSelectedTask(null);
    showToast('🗑️ Задача удалена');
  }, []);

  const handleDepsChange = useCallback((newDeps) => {
    setDeps(newDeps);
  }, []);

  const handleExport = useCallback(() => {
    const data = [
      ['Задача','Описание','Исполнитель','Длительность (дни)','Зависимости','Начало','Конец'],
      ...tasks.map(t => {
        const taskDeps = deps.filter(d => d.to_task_id === t.id);
        const depStr = taskDeps.map(d => {
          const from = tasks.find(tt => tt.id === d.from_task_id);
          return `${from ? from.task : d.from_task_id} (${d.type}${d.lag_days > 0 ? '+' + d.lag_days : ''})`;
        }).join('; ');
        return [t.task, t.description||'', t.assignee||'', t.duration, depStr||'', t.start_date||'', t.end_date||''];
      }),
    ];
    const ws = XLSX.utils.aoa_to_sheet(data);
    ws['!cols'] = [{wch:28},{wch:40},{wch:18},{wch:18},{wch:40},{wch:14},{wch:14}];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'План проекта');
    XLSX.writeFile(wb, 'plan.xlsx');
    showToast('📥 План экспортирован в plan.xlsx');
  }, [tasks, deps]);

  const handleImport = useCallback((e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const wb = XLSX.read(ev.target.result, {type:'array'});
        const ws = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(ws, {header:1});
        if (!rows || rows.length < 2) { showToast('❌ Файл пуст'); return; }
        const imported = [];
        // Track predecessor names for second pass
        const predRefs = [];
        for (let i = 1; i < rows.length; i++) {
          const r = rows[i];
          if (!r[0]) continue;
          const predRaw = r[4] ? String(r[4]).trim() : '';
          imported.push({
            id: genNextId(imported),
            task: String(r[0]).trim(),
            description: r[1] ? String(r[1]).trim() : '',
            assignee: r[2] ? String(r[2]).trim() : '',
            duration: parseInt(r[3]) || 3,
            color: COLORS[(i - 1) % COLORS.length],
          });
          predRefs.push(predRaw);
        }
        // Second pass: create dependencies from predecessor names
        const importedDeps = [];
        let depCounter = 1;
        imported.forEach((task, idx) => {
          const raw = predRefs[idx];
          if (!raw) return;
          // Split by ; or , or newline
          const names = raw.split(/[;,，\n]+/).map(s => s.trim()).filter(Boolean);
          names.forEach(name => {
            // Find predecessor task by name (case-insensitive)
            const pred = imported.find(t => t.task.toLowerCase() === name.toLowerCase());
            if (pred && pred.id !== task.id) {
              // Avoid duplicate
              const exists = importedDeps.some(d =>
                d.from_task_id === pred.id && d.to_task_id === task.id
              );
              if (!exists) {
                importedDeps.push({
                  id: 'import_dep' + (depCounter++),
                  from_task_id: pred.id,
                  to_task_id: task.id,
                  type: 'FS',
                  lag_days: 0,
                });
              }
            }
          });
        });
        if (imported.length > 0) {
          setRawTasks(imported);
          setDeps(importedDeps);
          showToast(`📤 Импортировано ${imported.length} задач, ${importedDeps.length} связей`);
        } else {
          showToast('❌ Не найдено задач в файле');
        }
      } catch (err) {
        showToast('❌ Ошибка чтения файла. Проверьте формат.');
      }
    };
    reader.readAsArrayBuffer(file);
    if (fileRef.current) fileRef.current.value = '';
  }, []);

  const handleReset = useCallback(() => {
    setRawTasks(SEED_TASKS.map(t => ({...t})));
    setDeps(SEED_DEPENDENCIES.map(d => ({...d})));
    setSelectedTask(null);
    showToast('🔄 План сброшен к тестовым данным');
  }, []);

  const totalDur = displayedTasks.reduce((s,t) => s + (t.duration||0), 0);
  const completedTasksCount = rawTasks.filter(t => !!t.completed).length;
  const projectProgressPct = rawTasks.length > 0
    ? Math.round((completedTasksCount / rawTasks.length) * 100)
    : 0;
  const assignees = [...new Set(tasks.map(t => t.assignee).filter(Boolean))];
  
  // Confetti trigger when 100% completed
  useEffect(() => {
    if (projectProgressPct >= 100 && rawTasks.length > 0) {
      setShowConfetti(true);
      if (confettiTimerRef.current) clearTimeout(confettiTimerRef.current);
      confettiTimerRef.current = setTimeout(() => setShowConfetti(false), 10000);
    }
    return () => { if (confettiTimerRef.current) clearTimeout(confettiTimerRef.current); };
  }, [projectProgressPct, rawTasks.length]);
  
  return (
    <>
      <div className="header">
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <h1 style={{color:'#fdcb6e',WebkitTextFillColor:'#fdcb6e',background:'none'}}>REPKA Project</h1>
          <span style={{fontSize:'0.7rem',color:'var(--text2)',background:'var(--surface2)',padding:'2px 8px',borderRadius:10}}>AI-Native</span>
        </div>
        <div className="header-actions">
          <input ref={fileRef} type="file" accept=".xlsx,.xls" style={{display:'none'}} onChange={handleImport}/>
          <button className="btn btn-sm" onClick={() => fileRef.current?.click()}>📤 Импорт Excel</button>
          <button className="btn btn-sm" onClick={handleExport}>📥 Экспорт Excel</button>
          <div style={{width:20}}></div>
          <button
            onClick={() => setTheme(theme === 'dark' ? 'light' : 'dark')}
            title={theme === 'dark' ? 'Светлая тема' : 'Тёмная тема'}
            style={{
              width:34, height:34, borderRadius:'50%', border:'1px solid var(--border)',
              background: `conic-gradient(#0f1117 0deg 180deg, #f5f6fa 180deg 360deg)`,
              cursor:'pointer', flexShrink:0, padding:0, outline:'none',
              boxShadow: theme === 'dark' ? '0 0 0 2px var(--accent)' : '0 0 0 2px #aaa'
            }}
          />
        </div>
      </div>

      <div className="main">
        <div className="gantt-panel">
          <div className="gantt-toolbar">
            <input className="project-name-input" value={projectName} onChange={e => setProjectName(e.target.value)} placeholder="Название проекта" />
            <span style={{color:'var(--text2)',fontSize:'0.78rem',display:'flex',alignItems:'center',gap:4}}>
              Выполнено: <strong>{projectProgressPct}%</strong>
            </span>
            <span style={{marginLeft:'auto',color:'var(--text2)',fontSize:'0.78rem'}}>Старт: <strong>{projectActualStart.split('-').reverse().join('-')}</strong></span>
            <span style={{color:'var(--text2)',fontSize:'0.78rem'}}>Финиш: <strong>{projectEnd.split('-').reverse().join('-')}</strong></span>
          </div>
          <GanttChart 
            tasks={displayedTasks} 
            dependencies={deps}
            projectStart={projectStart} 
            selectedId={selectedTask?.id} 
            onSelect={setSelectedTask}
            showDeps={showDeps}
            showCritical={showCritical}
            criticalIds={criticalIds}
            criticalDepIds={criticalDepIds}
          />
          <div className="stats">
            <span>👥 Исполнители:</span>
            {assignees.map(a => (
              <span key={a} className={'badge' + (executorFilter === a ? ' active' : '')}
                onClick={() => setExecutorFilter(executorFilter === a ? null : a)}
                title={executorFilter === a ? 'Показать все задачи' : 'Показать только задачи ' + a}>
                {a}
              </span>
            ))}
            {executorFilter && <button className="btn btn-sm" style={{marginLeft:8}} onClick={() => setExecutorFilter(null)}>✕ Показать все</button>}
            <span style={{marginLeft:'auto'}}>
              {rawTasks.length} задач · {deps.length} связей · {totalDur} дн. · {assignees.length} исп.
            </span>
          </div>
        </div>

        <div className={`chat-toggle-tab${chatOpen ? '' : ' collapsed'}`} onClick={() => setChatOpen(prev => !prev)} title={chatOpen ? 'Скрыть AI агента' : 'Показать AI агента'}>
          {chatOpen ? '◀' : '▶'}
        </div>
        <ChatPanel tasks={rawTasks} dependencies={deps} onPlanUpdate={handlePlanUpdate} chatOpen={chatOpen} onToggleChat={() => setChatOpen(prev => !prev)}/>
      </div>

      {selectedTask && (
        <TaskModal
          task={selectedTask}
          allTasks={tasks}
          dependencies={deps}
          onClose={() => setSelectedTask(null)}
          onSave={handleSaveTask}
          onDelete={handleDeleteTask}
          onComplete={handleCompleteTask}
          onDepsChange={handleDepsChange}
        />
      )}
      {toast && <div className="toast">{toast}</div>}
      {showConfetti && <ConfettiOverlay />}
    </>
  );
}

  // Configure backend API URL
  // Для локальной разработки используйте http://localhost:8000
  // Для деплоя на Render замените на: https://gantt-plan-editor-api.onrender.com
  window.__GANTT_API_URL__ = 'http://localhost:8000';
  
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
